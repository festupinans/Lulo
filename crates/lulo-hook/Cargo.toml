[package]
name = "lulo-hook"
version = "0.3.0"
description = "Claude Code hook that records each session's live state for the Lulo widget"
edition.workspace = true
repository.workspace = true

[dependencies]
# preserve_order keeps the user's settings.json key order when we rewrite it.
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
winresource = "0.1"
