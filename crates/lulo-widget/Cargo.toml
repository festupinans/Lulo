[package]
name = "lulo-widget"
version = "0.3.0"
description = "Always-on-top widget showing the live state of every Claude Code session"
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# glow (OpenGL) instead of the default wgpu backend: far less memory for a tiny window.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
notify = "8"
serde_json = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows toasts (WinRT). Bindings only; nothing runs until a toast is shown.
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Win32_System_WinRT"] }
# The same winit eframe uses, to turn off the drop shadow it asks for.
winit = { version = "0.30", default-features = false }

[build-dependencies]
winresource = "0.1"
